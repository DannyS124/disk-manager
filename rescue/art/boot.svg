<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Drawn for DiskForge Rescue; the drive in the middle is DiskForge's own icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#00b4ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00b4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5462"/>
      <stop offset="1" stop-color="#262b33"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <g transform="translate(880 70) scale(1.25)">
    <rect x="8" y="20" width="112" height="88" rx="14" fill="url(#body)" stroke="#171a20" stroke-width="2"/>
  <rect x="10" y="22" width="108" height="40" rx="12" fill="url(#shine)"/>
  <rect x="20" y="36" width="88" height="32" rx="5" fill="#15181d"/>
  <rect x="23" y="39" width="18" height="26" rx="2" fill="#1d99f3"/>
  <rect x="23" y="39" width="18" height="5" rx="1.5" fill="#7cc7ff"/>
  <rect x="44" y="39" width="42" height="26" rx="2" fill="#1d99f3"/>
  <rect x="44" y="39" width="42" height="5" rx="1.5" fill="#7cc7ff"/>
  <rect x="89" y="39" width="16" height="26" rx="2" fill="#5d6673"/>
  <rect x="89" y="39" width="16" height="5" rx="1.5" fill="#8b95a3"/>
  <rect x="20" y="84" width="54" height="7" rx="3.5" fill="#5d6673"/>
  <circle cx="100" cy="87.5" r="5.5" fill="#2ecc71"/>
  <circle cx="100" cy="87.5" r="2.5" fill="#a8f0c6"/>
  </g>
  <text x="960" y="320" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="60" fill="#e6edf7">DiskForge <tspan fill="#00b4ff">Rescue</tspan></text>

</svg>
