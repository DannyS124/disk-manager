<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- The desktop background. The home screen draws its tiles on top, so it stays calm: the
       colours, a glow, and a big faint spark in the corner. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1124"/>
      <stop offset="1" stop-color="#03060e"/>
    </linearGradient>
    <radialGradient id="glow" cx="1500" cy="760" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.13"/>
      <stop offset="0.5" stop-color="#1f6fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#1f6fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="low" cx="300" cy="1080" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f6fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1f6fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#low)"/>
  <g transform="translate(1500 760)" opacity="0.10">
    <path d="M0 -420 C40 -90 90 -20 420 0 C90 20 40 90 0 420 C-40 90 -90 20 -420 0 C-90 -20 -40 -90 0 -420 Z" fill="#00e5ff"/>
  </g>
  <g transform="translate(1500 760)" opacity="0.18">
    <path d="M0 -420 C40 -90 90 -20 420 0 C90 20 40 90 0 420 C-40 90 -90 20 -420 0 C-90 -20 -40 -90 0 -420 Z" fill="none" stroke="#9ad8ff" stroke-width="2"/>
  </g>
  <circle cx="1810" cy="260" r="6" fill="#2bee8a" opacity="0.35"/>
  <circle cx="1130" cy="330" r="4" fill="#ff3355" opacity="0.30"/>
  <circle cx="1240" cy="980" r="3" fill="#9ad8ff" opacity="0.35"/>
</svg>
