<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- The glow behind the logo; the boot animation fades it in and out. -->
  <defs>
    <radialGradient id="glow" cx="200" cy="200" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#1f6fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1f6fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#glow)"/>
</svg>
