<svg xmlns="http://www.w3.org/2000/svg" width="10" height="40" viewBox="0 0 10 40">
  <!-- Right end of the selection bar: fades out. -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6fff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1f6fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="10" height="40" fill="url(#fade)"/>
</svg>
