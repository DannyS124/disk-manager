  <line x1="194" y1="86" x2="194" y2="46" stroke="#2a6aa3" stroke-width="2"/>
  <text x="120" y="26" font-size="14" font-weight="bold" fill="#2a6aa3">Data (small, 7 pins)</text>
  <text x="120" y="42" font-size="12" fill="#4b5c7e">leave this one plugged in</text>
  <line x1="370" y1="86" x2="370" y2="46" stroke="#007f9c" stroke-width="2"/>
  <text x="330" y="26" font-size="14" font-weight="bold" fill="#007f9c">Power (wide, 15 pins)</text>
  <text x="330" y="42" font-size="12" fill="#4b5c7e">this is the one you unplug</text>
  <text x="40" y="170" font-size="12" fill="#4b5c7e">Both are L-shaped, so a plug only fits one way round. Never force it.</text>
  <text x="40" y="192" font-size="12" fill="#4b5c7e">Which side each one is on depends on how you hold the drive. Go by size.</text>
